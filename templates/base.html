<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Pit{% endblock %}</title>
  <link rel="icon" href="/favicon.ico" type="image/jpeg">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header>
    <div class="header-top">
      <span class="logo">THE PIT</span>
    </div>
    <div class="tab-bar">
      <a href="{{ url_for('home') }}"     class="nav-tab {% if request.endpoint == 'home'     %}active{% endif %}">Home</a>
      <a href="{{ url_for('releases') }}" class="nav-tab {% if request.endpoint == 'releases' %}active{% endif %}">Releases</a>
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
